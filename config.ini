# FastGithubCpp 配置（与 exe 同目录）
# 修改后重启程序/服务生效

# 手动 CONNECT 代理端口（透明模式不用设置，但保留备用）
port=38457

# 透明模式本地接收端口，分别对应 443 / 22 / 9418 / 80
redirect_https_port=38443
redirect_ssh_port=38422
redirect_git_port=38418
redirect_http_port=38480

# DNS 服务器，必须支持 TCP:53 查询；分号分隔
dns=8.8.8.8;119.29.29.29;114.114.114.114

# 走“选 IP”加速的域名；分号分隔，支持 *. 通配
domains=github.com;www.github.com;api.github.com;gist.github.com;raw.githubusercontent.com;githubusercontent.com;github.io;githubapp.com;githubassets.com;githubstatus.com;vscode-auth.github.com;codeload.github.com;objects.githubusercontent.com;avatars.githubusercontent.com;release-assets.githubusercontent.com;uploads.github.com;pipelines.actions.githubusercontent.com

# 是否查询 AAAA（透明模式下 AAAA 会被应答为空以强制 IPv4）
ipv6=true

# 打印详细日志到控制台和 fastgithubcpp.log
verbose=true

# 单次 DNS 查询超时（毫秒）
dns_timeout_ms=1500

# 单 IP TCP 连接测速超时（毫秒）
connect_timeout_ms=3000

# 真正建立上游连接超时（毫秒）
upstream_timeout_ms=10000
